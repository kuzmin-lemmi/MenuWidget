name: Build and technical probes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build and run synthetic checks
        shell: pwsh
        run: ./scripts/Build.ps1 -PublishPrototype
      - name: Upload interface prototype (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: MenuWidget-interface-prototype-win-x64
          path: artifacts/prototype/
          if-no-files-found: error
          retention-days: 14
